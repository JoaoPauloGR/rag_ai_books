[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "gradio",
    "langchain-text-splitters",
    "ollama",
    "pymupdf",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
